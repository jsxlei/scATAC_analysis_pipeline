cluster: "sbatch -J {cluster.jobname} -p {cluster.partition} --requeue --open-mode=append -N {cluster.n_node} {cluster.gres} -n {cluster.n_task} -c {cluster.n_cpu} -o {cluster.output} -e {cluster.error}"
cluster-config: profiles/cls/cls.yaml
keep-going: true
printshellcmds: true
reason: true
resources: gpu=28
use-conda: true