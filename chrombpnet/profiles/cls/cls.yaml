__default__:
  jobname: "{rule}"
  output: ".slurm/{rule}/{wildcards.cell_type}.out"
  error: ".slurm/{rule}/{wildcards.cell_type}.err"
  partition: akundaje
  gres: ""
  time: "2-0"
  n_node: 1
  n_task: 1
  n_cpu: "{threads}"

negative:
  partition: akundaje,owners
  time: "2-0"
  mem: "30G"

train:
  output: ".slurm/{rule}/{wildcards.cell_type}_{wildcards.fold}.out"
  error: ".slurm/{rule}/{wildcards.cell_type}_{wildcards.fold}.err"
  partition: akundaje,owners,gpu
  time: "2-0"
  gres: "--gres=gpu:1"
  mem: "60G"

deepshap:
  output: ".slurm/{rule}/{wildcards.cell_type}_{wildcards.fold}_{wildcards.head}.out"
  error: ".slurm/{rule}/{wildcards.cell_type}_{wildcards.fold}_{wildcards.head}.err"
  partition: akundaje,owners,gpu
  time: "2-0"
  gres: "--gres=gpu:1"
  mem: "60G"

average_shap:
  partition: akundaje,owners,normal
  time: "2-0"
  mem: "30G"

modisco:
  partition: akundaje,owners
  time: "7-0"
  mem: "50G"

generate_prediction:
  partition: akundaje,owners
  time: "5-0"
  mem: "30G"

make_contrib_bw:
  partition: akundaje,owners
  time: "7-0"
  mem: "30G"

hitcaller:
  partition: akundaje,owners,gpu
  time: "2-0"
  gres: "--gres=gpu:1"
  mem: "40G"