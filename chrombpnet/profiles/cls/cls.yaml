__default__:
  jobname: "{rule}"
  output: ".slurm/{rule}/{wildcards.cell_type}_{wildcards.head}.out"
  error: ".slurm/{rule}/{wildcards.cell_type}_{wildcards.head}.err"
  partition: akundaje
  gres: ""
  time: "2-0"
  n_node: 1
  n_task: 1
  n_cpu: "{threads}"
  mem: "30G"

negatives:
  output: ".slurm/{rule}/{wildcards.fold}.out"
  error: ".slurm/{rule}/{wildcards.fold}.err"
  partition: akundaje,owners,normal

train:
  output: ".slurm/{rule}/{wildcards.cell_type}_{wildcards.fold}.out"
  error: ".slurm/{rule}/{wildcards.cell_type}_{wildcards.fold}.err"
  partition: akundaje,owners,gpu
  gres: "--gres=gpu:1"
  mem: "{resources.mem_gb}G"

shap:
  output: ".slurm/{rule}/{wildcards.cell_type}_{wildcards.fold}_{wildcards.head}.out"
  error: ".slurm/{rule}/{wildcards.cell_type}_{wildcards.fold}_{wildcards.head}.err"
  partition: akundaje,owners,gpu
  gres: "--gres=gpu:1"
  mem: "{resources.mem_gb}G"

average_shap:
  partition: akundaje,owners,normal
  mem: "{resources.mem_gb}G"
  time: "08:00:00"

modisco:
  partition: akundaje,owners,normal
  mem: "{resources.mem_gb}G"

hitcaller:
  partition: akundaje,owners,gpu,dev
  gres: "--gres=gpu:1"
  time: "02:00:00"

generate_prediction:
  partition: akundaje,owners,normal